<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      // Apply the saved theme before first paint to avoid a flash of the default.
      try { document.documentElement.dataset.theme = localStorage.getItem('overlap:theme') || 'dreamy-lavender'; } catch (e) { document.documentElement.dataset.theme = 'dreamy-lavender'; }
    </script>
    <title>Overlap</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
